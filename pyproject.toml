[project]
name = "writing-brain"
version = "0.1.0"
description = "Personal writing brain with writer, reviewer, and memory workflows"
requires-python = ">=3.9"
dependencies = [
  "python-docx>=1.1.0",
]

[project.scripts]
writing-brain = "writing_brain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["writing_brain"]
