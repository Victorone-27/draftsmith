[project]
name = "draftsmith"
version = "0.1.0"
description = "A three-role writing system: draft, review, remember."
requires-python = ">=3.9"
dependencies = [
  "python-docx>=1.1.0",
  "Pillow>=10.0.0",
]

[project.scripts]
writing-brain = "writing_brain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["writing_brain"]
